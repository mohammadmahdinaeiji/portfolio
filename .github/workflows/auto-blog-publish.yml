name: AI Blog Publisher

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday at 06:30 UTC. GitHub may delay scheduled runs.
    - cron: "30 6 * * 1,4"

permissions:
  contents: write

concurrency:
  group: ai-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate, validate and insert article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
        run: python .github/scripts/blog-automation/publish_blog.py

      - name: Validate changed HTML and XML
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          root = Path('.')

          class Check(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          html_files = [root / 'index.html', root / 'blog/index.html']
          html_files += list((root / 'blog').glob('*/index.html'))

          for path in html_files:
              if not path.exists():
                  raise FileNotFoundError(f'Required HTML file not found: {path}')
              parser = Check(convert_charrefs=True)
              parser.feed(path.read_text(encoding='utf-8'))
              parser.close()

          ET.parse(root / 'sitemap.xml')
          print(f'Validated {len(html_files)} HTML files and sitemap.xml')
          PY

      - name: Commit and push only after validation passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish AI-generated bilingual blog article"
          git push
