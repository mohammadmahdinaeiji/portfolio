
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="description" content="راه‌های ارتباطی محمدمهدی نائیجی؛ طراح گرافیک و هنرمند بصری.">
  <title>ارتباط با محمدمهدی نائیجی</title>
  <style>
    @font-face{font-family:Peyda;src:url("fonts/PeydaWebFaNum-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:Peyda;src:url("fonts/PeydaWebFaNum-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
    @font-face{font-family:Peyda;src:url("fonts/PeydaWebFaNum-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:Peyda;src:url("fonts/PeydaWebFaNum-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
    :root{
      --bg:#0a0c0f;--surface:rgba(17,20,25,.82);--surface2:#171b21;
      --text:#f7f8fa;--muted:#9ba3af;--line:rgba(255,255,255,.09);
      --accent:#10b981;--deep:#075b43;--shadow:0 28px 90px rgba(0,0,0,.48);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;min-height:100svh;overflow-x:hidden;display:grid;place-items:center;
      padding:28px 18px calc(28px + env(safe-area-inset-bottom));
      color:var(--text);font-family:Peyda, sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%,rgba(16,185,129,.13),transparent 42%),
        radial-gradient(circle at 8% 12%,rgba(16,185,129,.12),transparent 25rem),
        radial-gradient(circle at 92% 88%,rgba(7,91,67,.24),transparent 28rem),var(--bg);
      isolation:isolate;
    }
    body::before{
      content:"";position:fixed;inset:-35%;z-index:-3;pointer-events:none;
      background:conic-gradient(from 0deg at 50% 50%,transparent 0 20%,rgba(16,185,129,.07) 28%,transparent 38% 65%,rgba(16,185,129,.05) 74%,transparent 86%);
      filter:blur(55px);animation:ambient 26s linear infinite;
    }
    body::after{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.2;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:38px 38px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%);
    }
    .glow{position:fixed;z-index:-2;width:220px;height:220px;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none}
    .glow.one{background:#10b981;top:7%;left:-110px;animation:floatA 12s ease-in-out infinite}
    .glow.two{background:#087b59;right:-120px;bottom:5%;animation:floatB 15s ease-in-out infinite}
    .orbit{position:fixed;z-index:-2;width:430px;height:430px;border:1px solid rgba(16,185,129,.11);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    .orbit::before,.orbit::after{content:"";position:absolute;border:1px solid rgba(16,185,129,.09);border-radius:50%;inset:34px}
    .orbit::after{inset:76px}
    .card{
      width:min(100%,430px);position:relative;padding:34px 24px 25px;
      border:1px solid rgba(255,255,255,.12);border-radius:30px;
      background:linear-gradient(145deg,rgba(255,255,255,.055),transparent 38%),var(--surface);
      box-shadow:var(--shadow),0 0 55px rgba(16,185,129,.075);
      -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
      overflow:hidden;animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .card::before{
      content:"";position:absolute;inset:0 18% auto;height:1px;
      background:linear-gradient(90deg,transparent,rgba(16,185,129,.75),transparent);
    }
    .card::after{
      content:"";position:absolute;width:190px;height:190px;left:-105px;top:-105px;
      border:1px solid rgba(16,185,129,.14);border-radius:50%;box-shadow:0 0 0 22px rgba(16,185,129,.025),0 0 0 46px rgba(16,185,129,.018);
      pointer-events:none;
    }
    .top{text-align:center;position:relative;z-index:1}
    .icon-slot{
      width:82px;height:82px;margin:0 auto 19px;border-radius:25px;
      display:grid;place-items:center;position:relative;
      background:linear-gradient(145deg,rgba(16,185,129,.22),rgba(7,91,67,.16));
      border:1px solid rgba(16,185,129,.34);box-shadow:0 12px 35px rgba(16,185,129,.14),inset 0 1px rgba(255,255,255,.1);
      animation:iconFloat 5s ease-in-out infinite;
    }
    .icon-slot::before{content:"";position:absolute;inset:-7px;border:1px solid rgba(16,185,129,.14);border-radius:30px}
    .icon-slot img{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:6px;
}

.icon-slot .intro-gif,
.icon-slot .site-icon{
  position:absolute;
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:6px;
}
    .icon-slot .intro-gif{z-index:2}
    .icon-slot .site-icon{z-index:1;opacity:0;visibility:hidden}
    .icon-slot.gif-finished .intro-gif{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
    .icon-slot.gif-finished .site-icon{opacity:1;visibility:visible}
    .monogram{font-size:25px;font-weight:700;letter-spacing:-2px;color:#d9fff1}
    .eyebrow{font-size:10px;letter-spacing:2.8px;color:var(--accent);font-family:Arial,sans-serif;direction:ltr;margin:0 0 10px}
    h1{font-size:25px;line-height:1.65;font-weight:700;margin:0;color:var(--text)}
    .sub{font-size:12px;color:var(--muted);line-height:1.9;margin:3px 0 25px}
    .links{display:grid;gap:10px;position:relative;z-index:1}
    .link{
      min-height:65px;display:flex;align-items:center;gap:13px;padding:10px 13px;
      text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:17px;
      background:rgba(255,255,255,.025);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,box-shadow .3s;
      -webkit-tap-highlight-color:transparent;
    }
    .link:active{transform:scale(.985)}
    .link:hover{transform:translateY(-3px);background:rgba(16,185,129,.075);border-color:rgba(16,185,129,.42);box-shadow:0 12px 28px rgba(0,0,0,.16)}
    .link-icon{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(16,185,129,.11);color:#54d9ac;border:1px solid rgba(16,185,129,.13);transition:transform .3s,background .3s}
    .link:hover .link-icon{transform:rotate(-7deg) scale(1.06);background:rgba(16,185,129,.2)}
    .link-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .link-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
    .link-title{font-size:13px;font-weight:600}
    .link-detail{font-family:Arial,sans-serif;direction:ltr;text-align:right;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{font:18px Arial,sans-serif;color:#68756f;transition:transform .3s,color .3s}
    .link:hover .arrow{transform:translate(-3px,-3px);color:var(--accent)}
    .divider{height:1px;margin:22px 2px 18px;background:linear-gradient(90deg,transparent,var(--line),rgba(16,185,129,.3),var(--line),transparent)}
    .portfolio{
      min-height:61px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:0 18px;border-radius:17px;position:relative;overflow:hidden;
      text-decoration:none;color:#052b20;font-size:14px;font-weight:700;
      background:linear-gradient(110deg,#0b805d,#20d39a 48%,#0b805d);
      background-size:220% 100%;box-shadow:0 12px 30px rgba(16,185,129,.2);
      transition:transform .35s,box-shadow .35s,background-position .6s;
      animation:buttonShimmer 5s ease-in-out infinite;
    }
    .portfolio::before{content:"";position:absolute;top:-80%;left:-35%;width:28%;height:260%;transform:rotate(25deg);background:rgba(255,255,255,.28);filter:blur(9px);transition:left .7s}
    .portfolio:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(16,185,129,.3);background-position:100% 0}
    .portfolio:hover::before{left:115%}
    .portfolio span,.portfolio svg{position:relative;z-index:1}
    .portfolio svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
    .portfolio:hover svg{transform:translate(-4px,-3px)}
    .note{text-align:center;color:#68736f;font-size:10px;margin:19px 0 0;letter-spacing:.2px;position:relative;z-index:1}
    .note b{color:var(--accent);font-weight:500}
    @keyframes ambient{to{transform:rotate(360deg)}}
    @keyframes floatA{50%{transform:translate(55px,45px) scale(1.2)}}
    @keyframes floatB{50%{transform:translate(-45px,-55px) scale(.85)}}
    @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(2deg)}}
    @keyframes buttonShimmer{0%,65%,100%{background-position:0 0}82%{background-position:100% 0}}

    /* More energetic motion, designed for touch screens */
    .card{animation:cardImpact 1.05s cubic-bezier(.16,1,.3,1) both}
    .icon-slot{animation:iconPop 1.1s cubic-bezier(.16,1,.3,1) .18s both, iconFloat 3.4s ease-in-out 1.3s infinite}
    .links .link{opacity:0;animation:linkBurst .7s cubic-bezier(.2,1.35,.35,1) forwards}
    .links .link:nth-child(1){animation-delay:.28s}
    .links .link:nth-child(2){animation-delay:.42s}
    .links .link:nth-child(3){animation-delay:.56s}
    .portfolio{animation:portfolioEnter .8s cubic-bezier(.2,1.4,.35,1) .72s both,buttonShimmer 3s ease-in-out 1.6s infinite}
    .link:active,.portfolio:active{transform:scale(.94)}
    .link.is-leaving,.portfolio.is-leaving{animation:tapExit .58s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
    body.page-leaving .card{animation:pageExit .72s cubic-bezier(.7,0,.2,1) forwards}
    body.page-leaving .glow{animation:glowExit .72s ease-in forwards}
    /* Replay the entrance when the visitor returns to this tab. */
    body.page-returning .card{animation:cardImpact 1.05s cubic-bezier(.16,1,.3,1) both}
    body.page-returning .icon-slot{animation:iconPop 1.1s cubic-bezier(.16,1,.3,1) .18s both,iconFloat 3.4s ease-in-out 1.3s infinite}
    body.page-returning .links .link{opacity:0;animation:linkBurst .7s cubic-bezier(.2,1.35,.35,1) forwards}
    body.page-returning .links .link:nth-child(1){animation-delay:.28s}
    body.page-returning .links .link:nth-child(2){animation-delay:.42s}
    body.page-returning .links .link:nth-child(3){animation-delay:.56s}
    body.page-returning .portfolio{animation:portfolioEnter .8s cubic-bezier(.2,1.4,.35,1) .72s both,buttonShimmer 3s ease-in-out 1.6s infinite}
    @keyframes cardImpact{0%{opacity:0;transform:translateY(70px) scale(.78) rotate(-3deg);filter:blur(14px)}65%{opacity:1;transform:translateY(-9px) scale(1.025) rotate(.6deg);filter:blur(0)}82%{transform:translateY(3px) scale(.99)}100%{transform:none}}
    @keyframes iconPop{0%{opacity:0;transform:translateY(-35px) rotate(-28deg) scale(.35)}65%{opacity:1;transform:translateY(7px) rotate(8deg) scale(1.16)}100%{transform:translateY(0) rotate(0) scale(1)}}
    @keyframes linkBurst{0%{opacity:0;transform:translateX(55px) scale(.82);filter:blur(7px)}70%{opacity:1;transform:translateX(-7px) scale(1.025);filter:blur(0)}100%{opacity:1;transform:none}}
    @keyframes portfolioEnter{0%{opacity:0;transform:translateY(35px) scale(.78) rotate(2deg)}70%{opacity:1;transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:none}}
    @keyframes tapExit{0%{opacity:1;transform:scale(1)}35%{transform:scale(1.06) rotate(-1deg)}100%{opacity:0;transform:translateY(-28px) scale(.72);filter:blur(8px)}}
    @keyframes pageExit{to{opacity:0;transform:translateY(-24px) scale(.9);filter:blur(12px)}}
    @keyframes glowExit{to{opacity:0;transform:scale(1.5)}}
    @media(max-width:360px){body{padding-inline:12px}.card{padding:29px 17px 22px;border-radius:25px}h1{font-size:22px}.link{min-height:61px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>

  <script>
    const introSlot = document.querySelector('.icon-slot');
    const introGif = document.querySelector('.intro-gif');
    const INTRO_SEEN_KEY = 'nfcIntroGifSeen';

    function finishIntroGif() {
      if (!introSlot) return;
      introSlot.classList.add('gif-finished');
      try { sessionStorage.setItem(INTRO_SEEN_KEY, '1'); } catch (_) {}
    }

    async function getGifDurationMs(url) {
      const response = await fetch(url, { cache: 'force-cache' });
      if (!response.ok) throw new Error('GIF could not be loaded');
      const bytes = new Uint8Array(await response.arrayBuffer());
      let p = 13;
      const packed = bytes[10];
      if (packed & 0x80) p += 3 * (2 ** ((packed & 7) + 1));
      let total = 0, pendingDelay = 0;

      const skipSubBlocks = () => {
        while (p < bytes.length) {
          const size = bytes[p++];
          if (size === 0) break;
          p += size;
        }
      };

      while (p < bytes.length) {
        const marker = bytes[p++];
        if (marker === 0x3B) break;
        if (marker === 0x21) {
          const label = bytes[p++];
          if (label === 0xF9) {
            const size = bytes[p++];
            if (size >= 4) {
              p++; // packed flags
              pendingDelay = bytes[p] | (bytes[p + 1] << 8);
              p += 2;
              p++; // transparent color index
            }
            if (bytes[p] === 0) p++;
            else skipSubBlocks();
          } else {
            skipSubBlocks();
          }
        } else if (marker === 0x2C) {
          const imagePacked = bytes[p + 8];
          p += 9;
          if (imagePacked & 0x80) p += 3 * (2 ** ((imagePacked & 7) + 1));
          p++; // LZW minimum code size
          skipSubBlocks();
          total += pendingDelay * 10;
          pendingDelay = 0;
        } else {
          break;
        }
      }
      return total > 0 ? total : 3000;
    }

    let introAlreadySeen = false;
    try { introAlreadySeen = sessionStorage.getItem(INTRO_SEEN_KEY) === '1'; } catch (_) {}

    if (introAlreadySeen || !introGif) {
      finishIntroGif();
    } else {
      introGif.addEventListener('error', finishIntroGif, { once: true });
      getGifDurationMs(introGif.src)
        .then(duration => window.setTimeout(finishIntroGif, duration))
        .catch(() => window.setTimeout(finishIntroGif, 3000));
    }

    const EXIT_DELAY = 620;
    let returnTimer;

    function replayEntrance() {
      window.clearTimeout(returnTimer);
      returnTimer = window.setTimeout(() => {
        document.body.classList.remove('page-leaving', 'page-returning');
        document.querySelectorAll('a.is-leaving').forEach(link => {
          link.classList.remove('is-leaving');
          delete link.dataset.navigating;
        });

        // Restart the entrance animation from its first frame.
        void document.querySelector('.card').offsetWidth;
        document.body.classList.add('page-returning');
        window.setTimeout(() => {
          document.body.classList.remove('page-returning');
        }, 1500);
      }, 180);
    }

    document.querySelectorAll('a[href]').forEach(link => {
      link.addEventListener('click', event => {
        const href = link.href;
        if (!href || href.startsWith('javascript:') || event.metaKey ||
            event.ctrlKey || event.shiftKey || event.altKey) return;
        if (link.dataset.navigating) {
          event.preventDefault();
          return;
        }

        event.preventDefault();
        link.dataset.navigating = '1';
        link.classList.add('is-leaving');

        if (link.target === '_blank') {
          // Keep this page visible during the delay; open the destination only afterwards.
          document.body.classList.add('page-leaving');
          window.setTimeout(() => {
            const newTab = window.open(href, '_blank', 'noopener,noreferrer');
            // Restore the original page so it is ready when the visitor returns.
            document.body.classList.remove('page-leaving');
            link.classList.remove('is-leaving');
            delete link.dataset.navigating;
            if (!newTab) replayEntrance(); // Browser may block delayed pop-ups.
          }, EXIT_DELAY);
          return;
        }

        document.body.classList.add('page-leaving');
        window.setTimeout(() => {
          window.location.href = href;
        }, EXIT_DELAY);
      });
    });

    // Restore the page after returning from another tab or browser history.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') replayEntrance();
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted) replayEntrance();
    });
  </script>
</body>
